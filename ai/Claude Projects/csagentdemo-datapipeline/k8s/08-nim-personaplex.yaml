# Personaplex TTS — custom FastAPI server loading nvidia/personaplex-7b-v1 from HuggingFace.
# Build locally on DGX Spark:
#   cd personaplex && docker build -t personaplex-tts:latest .
#   # or with containerd: nerdctl build -t personaplex-tts:latest .
#
# If nvidia/personaplex-7b-v1 is a gated HF repo, set HF_TOKEN in the secret below.
# Model weights are cached at /opt/personaplex/cache via PVC (local-path, NVMe).
# First startup downloads ~7B model; subsequent starts load from cache.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: personaplex-cache
  namespace: cs-inference
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personaplex-nim
  namespace: cs-inference
  labels:
    app: personaplex-nim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personaplex-nim
  template:
    metadata:
      labels:
        app: personaplex-nim
    spec:
      runtimeClassName: nvidia-cdi
      containers:
        - name: personaplex
          image: personaplex-tts:latest
          imagePullPolicy: Never   # built locally on DGX Spark
          ports:
            - containerPort: 8000
          env:
            - name: PERSONAPLEX_MODEL_ID
              value: "nvidia/personaplex-7b-v1"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: personaplex-secret
                  key: HF_TOKEN
                  optional: true   # not required if model is public
            - name: HF_HOME
              value: /opt/personaplex/cache
            - name: TRANSFORMERS_CACHE
              value: /opt/personaplex/cache
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: "6Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /opt/personaplex/cache
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 8000
            initialDelaySeconds: 120   # model download + load time on first run
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: personaplex-cache
---
apiVersion: v1
kind: Service
metadata:
  name: personaplex-nim
  namespace: cs-inference
spec:
  selector:
    app: personaplex-nim
  ports:
    - port: 8000
      targetPort: 8000
