# GPU time-slicing allows multiple NIM pods to share the DGX Spark GPU concurrently.
# Applied to the gpu-operator namespace. After applying, patch ClusterPolicy:
#   kubectl patch clusterpolicy cluster-policy --type merge \
#     -p '{"spec":{"devicePlugin":{"config":{"name":"time-slicing-config","default":"any"}}}}' \
#     --namespace gpu-operator
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        resources:
        - name: nvidia.com/gpu
          replicas: 8
