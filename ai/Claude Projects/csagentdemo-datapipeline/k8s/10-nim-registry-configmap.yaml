# Model endpoint registry — consumed by agent backend and pipeline jobs.
# All URLs use the external spark.local ingress path so services
# can be tested externally and the agent config is environment-agnostic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nim-registry
  namespace: cs-agent
data:
  LLM_BASE_URL: "http://qwen-nim.cs-inference.svc.cluster.local:8000/v1"
  LLM_MODEL: "Qwen/Qwen3.6-35B-A3B"
  EMBED_BASE_URL: "http://embedding-nim.cs-inference.svc.cluster.local:8000/v1"
  EMBED_MODEL: "nvidia/llama-3.2-nv-embedqa-1b-v2"
  MILVUS_HOST: "milvus.cs-pipeline.svc.cluster.local"
  MILVUS_PORT: "19530"
  NFS_CURATED_PATH: "/data/curated"
---
# Same registry for pipeline namespace (NV-Ingest needs embedding URL)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nim-registry
  namespace: cs-pipeline
data:
  EMBED_BASE_URL: "http://embedding-nim.cs-inference.svc.cluster.local:8000/v1"
  EMBED_MODEL: "nvidia/llama-3.2-nv-embedqa-1b-v2"
  MILVUS_HOST: "milvus.cs-pipeline.svc.cluster.local"
  MILVUS_PORT: "19530"
