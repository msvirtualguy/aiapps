# NGC registry pull secret for cs-inference namespace (NIM containers).
# Apply with: NGC_API_KEY=<your-key> envsubst < k8s/02-ngc-secret.yaml | kubectl apply -f -
# Or use: make nims (loads from config/.env automatically)
apiVersion: v1
kind: Secret
metadata:
  name: ngc-registry
  namespace: cs-inference
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "nvcr.io": {
          "username": "$oauthtoken",
          "password": "${NGC_API_KEY}",
          "auth": ""
        }
      }
    }
---
# Same secret for cs-pipeline namespace (NV-Ingest, NeMo Curator)
apiVersion: v1
kind: Secret
metadata:
  name: ngc-registry
  namespace: cs-pipeline
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "nvcr.io": {
          "username": "$oauthtoken",
          "password": "${NGC_API_KEY}",
          "auth": ""
        }
      }
    }
---
# NGC API key as an opaque secret for NIM containers to authenticate model downloads
apiVersion: v1
kind: Secret
metadata:
  name: ngc-api-key
  namespace: cs-inference
type: Opaque
stringData:
  NGC_API_KEY: "${NGC_API_KEY}"
