# Embedding service — NVIDIA vLLM (ARM64/Blackwell) serving llama-3.2-nv-embedqa-1b-v2
# Replaces the nv-embedqa NIM which uses ONNX Runtime without SM 12.1 kernels.
# vLLM natively supports pooling/embedding task, exposes OpenAI-compatible /v1/embeddings.
# Model dim: 2048 (update EMBED_DIM in run_ingest.py and agent/rag.py accordingly)
#
# Image: nvcr.io/nvidia/vllm:26.04-py3 (NVIDIA ARM64/Blackwell build)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embedding-cache
  namespace: cs-inference
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-nim
  namespace: cs-inference
  labels:
    app: embedding-nim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-nim
  template:
    metadata:
      labels:
        app: embedding-nim
    spec:
      runtimeClassName: nvidia-cdi
      imagePullSecrets:
        - name: ngc-registry
      containers:
        - name: vllm-embed
          image: nvcr.io/nvidia/vllm:26.04-py3
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
            - nvidia/llama-3.2-nv-embedqa-1b-v2
            - --trust-remote-code
            - --port
            - "8000"
            - --host
            - "0.0.0.0"
            - --dtype
            - bfloat16
            - --gpu-memory-utilization
            - "0.12"
          ports:
            - containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
            - name: HF_HOME
              value: /cache/huggingface
          resources:
            limits:
              cpu: "4"
              memory: "12Gi"
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: embed-cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
      volumes:
        - name: embed-cache
          persistentVolumeClaim:
            claimName: embedding-cache
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-nim
  namespace: cs-inference
spec:
  selector:
    app: embedding-nim
  ports:
    - port: 8000
      targetPort: 8000
